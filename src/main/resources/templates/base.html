<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
    <head>
        <meta charset="UTF-8">
        <title th:replace="${title}">GameVault</title>
        <link rel="stylesheet" th:href="@{/styles/style.css}">
    </head>
    <body>

        <nav>
            <th:block th:if="${session.usuario_id == null}">
                <a th:ref="@{/login}">Iniciar Sesión </a>
                <a th:ref="@{/registro}">Registro </a>
            </th:block>

            <th:block th:block th:if="${session.usuario_id != null}">
                <a th:href="@{/mis-juegos}">Mis juegos</a>
                <a th:href="@{/juegos/nuevos}">Subir Juego</a>
                <a th:href="@{/logout}">Logout</a>
            </th:block>

            <a th:href="@{/juegos}" class="nav-brand">🎮 GameVault</a>
            <div class="nav-links">
                <a th:href="@{/juegos}">Catálogo</a>
                <a th:href="@{/juegos/nuevo}">Subir Juego</a>
                <a th:href="@{/fragments-demo}" style="color: var(--success); margin-left:20px;">[Teoría]</a>
            </div>
        </nav>

        <main class="container" th:replace="${content}">
            Contenido por defecto...
        </main>

    </body>
</html>
